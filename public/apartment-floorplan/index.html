<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sơ đồ 3D minh hoạ căn hộ</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1eb;
        --surface: #fffdfa;
        --surface-muted: #eee8df;
        --fg: #342b25;
        --muted: #756960;
        --border: #dfd5ca;
        --primary: #c65a3a;
        --primary-soft: #f7e4dc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #viewer {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 420px;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: absolute;
        z-index: 2;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
        box-shadow: 0 12px 32px rgb(52 43 37 / 10%);
        backdrop-filter: blur(14px);
      }
      #title-panel {
        top: 16px;
        left: 16px;
        max-width: min(460px, calc(100% - 32px));
        padding: 14px 16px;
        border-radius: 18px;
      }
      #title-panel h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.3;
      }
      #title-panel p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }
      #room-panel {
        top: 16px;
        right: 16px;
        width: 190px;
        max-height: calc(100% - 32px);
        padding: 12px;
        border-radius: 18px;
        overflow: auto;
      }
      #room-panel h2 {
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #room-list {
        display: grid;
        gap: 6px;
      }
      .room-button,
      .control-button {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        text-align: left;
        padding: 8px 9px;
      }
      .room-button:hover,
      .room-button:focus-visible,
      .control-button:hover,
      .control-button:focus-visible {
        border-color: var(--primary);
        outline: none;
      }
      .room-button.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
      }
      #controls {
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        padding: 8px;
        border-radius: 14px;
      }
      .control-button {
        padding: 7px 10px;
      }
      #walk-panel {
        left: 16px;
        bottom: 72px;
        display: none;
        max-width: min(320px, calc(100% - 32px));
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 11px;
        line-height: 1.5;
      }
      #walk-panel p {
        margin: 0;
      }
      #room-announcer {
        margin-top: 4px;
        font-weight: 700;
        color: var(--primary);
      }
      #walk-dpad {
        display: none;
        grid-template-areas:
          '. forward .'
          'left back right';
        grid-template-columns: repeat(3, 44px);
        gap: 6px;
        margin-top: 8px;
      }
      .dpad-button {
        width: 44px;
        height: 44px;
        padding: 0;
        font-size: 18px;
        text-align: center;
        touch-action: none;
        user-select: none;
      }
      [data-walk-move='forward'] {
        grid-area: forward;
      }
      [data-walk-move='left'] {
        grid-area: left;
      }
      [data-walk-move='back'] {
        grid-area: back;
      }
      [data-walk-move='right'] {
        grid-area: right;
      }
      .walking #walk-panel {
        display: block;
      }
      .walking #canvas {
        touch-action: none;
        cursor: crosshair;
      }
      @media (pointer: coarse) {
        .walking #walk-dpad {
          display: grid;
        }
      }
      #loading,
      #error {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: var(--bg);
        color: var(--muted);
        font-size: 13px;
      }
      #error {
        display: none;
      }
      @media (max-width: 640px) {
        #room-panel {
          top: auto;
          bottom: 16px;
          right: 16px;
          width: min(190px, calc(100% - 32px));
          max-height: 150px;
        }
        #title-panel {
          right: 16px;
        }
        #walk-panel {
          right: 16px;
          bottom: 182px;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="viewer" aria-label="Sơ đồ 3D minh hoạ căn hộ">
      <canvas
        id="canvas"
        aria-label="Mô hình 3D minh hoạ bố cục căn hộ"
      ></canvas>
      <div id="loading" role="status">Đang chuẩn bị sơ đồ 3D...</div>
      <div id="error" role="alert">
        Không thể tải sơ đồ 3D trên thiết bị này.
      </div>
      <section id="title-panel" class="panel">
        <h1>Sơ đồ 3D minh hoạ</h1>
        <p>
          Bố cục được mô phỏng từ thông tin tin đăng, có thể khác hiện trạng
          thực tế.
        </p>
      </section>
      <aside id="room-panel" class="panel" aria-label="Danh sách không gian">
        <h2>Không gian</h2>
        <div id="room-list"></div>
      </aside>
      <div id="controls" class="panel" aria-label="Điều khiển sơ đồ">
        <button id="reset-button" class="control-button" type="button">
          Đặt lại góc nhìn
        </button>
        <button
          id="walk-button"
          class="control-button"
          type="button"
          aria-pressed="false"
        >
          Đi bộ
        </button>
        <button id="view-button" class="control-button" type="button" hidden>
          Góc nhìn thứ ba
        </button>
      </div>
      <section id="walk-panel" class="panel" aria-label="Chế độ đi bộ">
        <p id="walk-hint"></p>
        <p id="room-announcer" aria-live="polite"></p>
        <div id="walk-dpad">
          <button
            class="control-button dpad-button"
            type="button"
            data-walk-move="forward"
            aria-label="Đi tới"
          >
            ↑
          </button>
          <button
            class="control-button dpad-button"
            type="button"
            data-walk-move="left"
            aria-label="Sang trái"
          >
            ←
          </button>
          <button
            class="control-button dpad-button"
            type="button"
            data-walk-move="back"
            aria-label="Lùi lại"
          >
            ↓
          </button>
          <button
            class="control-button dpad-button"
            type="button"
            data-walk-move="right"
            aria-label="Sang phải"
          >
            →
          </button>
        </div>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      window.FloorplanHostBridge = {
        post: function (message, targetOrigin) {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify(message))
            return
          }
          window.parent.postMessage(message, targetOrigin)
        },
      }
    </script>
    <script src="./room-materials.js"></script>
    <script src="./layout-templates.js"></script>
    <script src="./floorplan-geometry.js"></script>
    <script src="./apartment-generator.js"></script>
    <script src="./walk-navigation.js"></script>
    <script src="./ui-controller.js"></script>
    <script src="./walk-controller.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
